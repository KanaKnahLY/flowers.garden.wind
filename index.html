<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇幻繽紛花園 Dynamic Flower Garden View</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', 'Comfortaa', sans-serif;
            overflow: hidden;
            background-color: #080f1e;
            user-select: none;
        }

        /* Glassmorphism styling components */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px) scale(1.03);
        }

        .glass-button.active {
            background: linear-gradient(135deg, rgba(244, 114, 182, 0.4), rgba(56, 189, 248, 0.4));
            border-color: rgba(244, 114, 182, 0.7);
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.35);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
        }

        /* Custom Interactive Wand Cursor Visual */
        .custom-cursor {
            pointer-events: none;
            position: fixed;
            width: 36px;
            height: 36px;
            transform: translate(-50%, -50%);
            z-index: 999;
            transition: transform 0.05s ease-out;
        }

        /* Ambient Glow Pulse Keyframe */
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .glow-pulse {
            animation: pulseGlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-full w-full relative text-slate-100 flex flex-col justify-between select-none overflow-hidden">

    <!-- Interactive Canvas Backdrop -->
    <canvas id="gardenCanvas" class="absolute inset-0 w-full h-full z-0 cursor-none"></canvas>

    <!-- Custom Cursor Sparkle Pointer -->
    <div id="customCursor" class="custom-cursor opacity-0 sm:opacity-100 flex items-center justify-center">
        <div class="relative w-8 h-8 flex items-center justify-center">
            <i class="fa-solid fa-wand-magic-sparkles text-2xl text-pink-300 filter drop-shadow-[0_0_10px_rgba(244,114,182,0.8)]"></i>
            <div id="cursorGlowRing" class="absolute inset-0 rounded-full border border-pink-400/60 animate-ping"></div>
        </div>
    </div>

    <!-- Header Controls & Garden Info Panel -->
    <header class="relative z-10 p-4 md:p-6 flex justify-between items-center pointer-events-none">
        <!-- Title Box -->
        <div class="glass-panel px-5 py-3 rounded-2xl flex items-center gap-3.5 pointer-events-auto shadow-2xl">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-pink-400 via-rose-300 to-amber-300 flex items-center justify-center text-slate-900 text-2xl shadow-lg shadow-pink-500/30">
                <i class="fa-solid fa-seedling animate-bounce"></i>
            </div>
            <div>
                <h1 class="font-black text-lg md:text-xl tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-pink-300 via-rose-200 to-amber-200">
                    奇幻繽紛動態花園
                </h1>
                <p class="text-[11px] text-pink-200/80 font-medium hidden sm:block">滑鼠掠過觸發綻放與隨風擺動 · 點擊播種繽紛花朵</p>
            </div>
        </div>

        <!-- Real-time Stats & Controls -->
        <div class="flex items-center gap-3 pointer-events-auto">
            <!-- Flower Counter Box -->
            <div class="glass-panel px-4 py-2.5 rounded-2xl hidden md:flex items-center gap-3 border-pink-500/30">
                <i class="fa-solid fa-spa text-pink-400 glow-pulse"></i>
                <div class="text-xs">
                    <span class="text-slate-400 text-[10px] block leading-none">花園數量</span>
                    <span id="flowerCountText" class="text-pink-300 font-bold tracking-wider">0 朵盛開</span>
                </div>
            </div>

            <!-- Audio Toggle -->
            <button id="soundToggleBtn" onclick="toggleAudio()" class="glass-button p-3 rounded-2xl text-amber-300 hover:text-amber-200 flex items-center gap-2 text-xs font-semibold shadow-lg" title="開啟/關閉自然琴音">
                <i id="soundIcon" class="fa-solid fa-volume-high text-base"></i>
                <span class="hidden md:inline" id="soundStatusText">琴音：開啟</span>
            </button>

            <!-- Control Settings Drawer Toggle -->
            <button onclick="toggleSettingsDrawer()" class="glass-button p-3 rounded-2xl text-pink-300 hover:text-pink-200 flex items-center gap-2 text-xs font-semibold shadow-lg">
                <i class="fa-solid fa-sliders text-base"></i>
                <span class="hidden md:inline">花園選單</span>
            </button>
        </div>
    </header>

    <!-- Interactive Mode Toolbar (Bottom Floating HUD) -->
    <div class="relative z-10 mb-6 mx-auto pointer-events-auto flex flex-col sm:flex-row items-center gap-3 px-4">
        <div class="glass-panel px-4 py-2.5 rounded-full flex items-center gap-2 shadow-2xl border border-white/20">
            <span class="text-xs font-semibold text-slate-300 ml-1 hidden sm:inline"><i class="fa-solid fa-wand-sparkles text-pink-300 mr-1.5"></i>互動模式:</span>
            
            <button id="modeBloom" onclick="setInteractionMode('bloom')" class="glass-button active px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2">
                <i class="fa-solid fa-hand-pointer text-pink-300"></i> 滑鼠傾擺與盛開 (Sway & Bloom)
            </button>
            
            <button id="modePlant" onclick="setInteractionMode('plant')" class="glass-button px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-emerald-300"></i> 點擊播種新花 (Seed)
            </button>

            <button id="modeMagic" onclick="setInteractionMode('magic')" class="glass-button px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2">
                <i class="fa-solid fa-wind text-cyan-300"></i> 花粉魔法流光 (Pollen Trail)
            </button>
        </div>

        <!-- Action Quick Buttons -->
        <div class="flex gap-2">
            <button onclick="triggerSuperBloom()" class="glass-button px-4 py-2.5 rounded-full text-xs font-bold text-amber-300 hover:text-amber-200 flex items-center gap-2 shadow-xl border-amber-500/30">
                <i class="fa-solid fa-sun animate-spin" style="animation-duration: 10s;"></i> 萬花齊放 (Super Bloom)
            </button>
            <button onclick="resetGarden()" class="glass-button px-4 py-2.5 rounded-full text-xs font-bold text-rose-300 hover:text-rose-200 flex items-center gap-2 shadow-xl border-rose-500/30">
                <i class="fa-solid fa-rotate-left"></i> 重置花園
            </button>
        </div>
    </div>

    <!-- Side Drawer Settings & Garden Customizer -->
    <div id="settingsDrawer" class="fixed inset-y-0 right-0 w-80 max-w-[85vw] glass-panel z-30 p-6 shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between pointer-events-auto">
        <div class="space-y-6 overflow-y-auto pr-1">
            <div class="flex justify-between items-center pb-3 border-b border-white/10">
                <h3 class="font-bold text-lg text-pink-300 flex items-center gap-2">
                    <i class="fa-solid fa-palette"></i> 花園主題與環境
                </h3>
                <button onclick="toggleSettingsDrawer()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Garden Lighting Theme Switcher -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-300">花園氛圍氣氛 Theme Mood</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setTheme('twilight')" class="p-2.5 rounded-xl glass-button text-xs font-semibold text-left border-purple-500/30">
                        🌌 靜謐暮光
                    </button>
                    <button onclick="setTheme('meadow')" class="p-2.5 rounded-xl glass-button text-xs font-semibold text-left border-emerald-500/30">
                        ☀️ 陽光草地
                    </button>
                    <button onclick="setTheme('pastel')" class="p-2.5 rounded-xl glass-button text-xs font-semibold text-left border-pink-500/30">
                        🦄 櫻花夢幻
                    </button>
                    <button onclick="setTheme('neon')" class="p-2.5 rounded-xl glass-button text-xs font-semibold text-left border-cyan-500/30">
                        ⚡ 賽博霓光
                    </button>
                </div>
            </div>

            <!-- Custom Planting Flower Species Selector -->
            <div class="space-y-2 pt-2">
                <label class="text-xs font-semibold text-slate-300">點擊播種品種 Preferred Plant Species</label>
                <select id="speciesSelect" class="w-full bg-slate-800/80 border border-white/20 text-slate-200 rounded-xl p-2.5 text-xs outline-none focus:border-pink-400">
                    <option value="random">🎲 隨機奇幻品種 (Random Mix)</option>
                    <option value="sakura">🌸 夢幻櫻花 (Cherry Blossom)</option>
                    <option value="sunflower">🌻 輝煌向日葵 (Sunflower)</option>
                    <option value="tulip">🌷 典雅鬱金香 (Royal Tulip)</option>
                    <option value="lotus">🪷 幻彩蓮花 (Glowing Lotus)</option>
                    <option value="daisy">🌼 清新雛菊 (Alpine Daisy)</option>
                </select>
            </div>

            <!-- Interactive Sliders -->
            <div class="space-y-4 pt-2">
                <div>
                    <div class="flex justify-between text-xs font-medium mb-1">
                        <span class="text-slate-300">微風強弱 Wind Intensity</span>
                        <span id="windVal" class="text-pink-400 font-bold">微風</span>
                    </div>
                    <input type="range" id="windSlider" min="0" max="3" value="1" oninput="updateWindIntensity(this.value)"
                        class="w-full accent-pink-400 bg-slate-800 rounded-lg cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between text-xs font-medium mb-1">
                        <span class="text-slate-300">花粉顆粒 Pollen Density</span>
                        <span id="pollenVal" class="text-amber-400 font-bold">高</span>
                    </div>
                    <input type="range" id="pollenSlider" min="10" max="80" value="40" oninput="updatePollenDensity(this.value)"
                        class="w-full accent-amber-400 bg-slate-800 rounded-lg cursor-pointer">
                </div>

                <div>
                    <div class="flex justify-between text-xs font-medium mb-1">
                        <span class="text-slate-300">生長響應感度 React Sensitivity</span>
                        <span id="reactVal" class="text-cyan-400 font-bold">敏銳</span>
                    </div>
                    <input type="range" id="reactSlider" min="1" max="3" value="2" oninput="updateSensitivity(this.value)"
                        class="w-full accent-cyan-400 bg-slate-800 rounded-lg cursor-pointer">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-4 border-t border-white/10 space-y-2">
                <button onclick="addDenseFlowerCluster()" class="w-full py-3 rounded-xl bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 hover:from-pink-600 hover:to-amber-600 font-bold text-xs tracking-wider uppercase shadow-lg transition">
                    🌸 滿園春色 (Plant Cluster)
                </button>
            </div>
        </div>

        <div class="text-[10px] text-slate-400 text-center pt-4">
            移動滑鼠可近距離激發花朵伸展、開花與發光反應
        </div>
    </div>

    <script>
        // Global Canvas Setup
        const canvas = document.getElementById('gardenCanvas');
        const ctx = canvas.getContext('2d');
        const customCursor = document.getElementById('customCursor');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Mouse & Touch Tracking State
        let mouse = {
            x: width / 2,
            y: height / 2,
            lastX: width / 2,
            lastY: height / 2,
            vx: 0,
            vy: 0,
            isDown: false,
            mode: 'bloom' // 'bloom', 'plant', 'magic'
        };

        // Configuration State
        let config = {
            theme: 'twilight',
            windLevel: 1,
            pollenDensity: 40,
            sensitivity: 2,
            selectedSpecies: 'random'
        };

        // Theme Lighting Color Definitions
        const GARDEN_THEMES = {
            twilight: {
                bgGradient: ['#090d1a', '#111827', '#080c18'],
                pollenColor: '#f472b6',
                groundColor: '#0f172a',
                stemBase: '#15803d'
            },
            meadow: {
                bgGradient: ['#062319', '#0d382c', '#051d14'],
                pollenColor: '#fef08a',
                groundColor: '#064e3b',
                stemBase: '#22c55e'
            },
            pastel: {
                bgGradient: ['#231221', '#331b31', '#1a0e19'],
                pollenColor: '#f43f5e',
                groundColor: '#4c1d95',
                stemBase: '#10b981'
            },
            neon: {
                bgGradient: ['#060913', '#0e1329', '#040710'],
                pollenColor: '#38bdf8',
                groundColor: '#1e1b4b',
                stemBase: '#06b6d4'
            }
        };

        // Flower Species Colors & Structure Metadata
        const SPECIES_TYPES = {
            sakura: {
                name: '櫻花',
                petals: 5,
                petalColors: ['#fbcfe8', '#f472b6', '#fda4af'],
                centerColor: '#fb7185',
                maxScale: 1.2
            },
            sunflower: {
                name: '向日葵',
                petals: 16,
                petalColors: ['#fde047', '#eab308', '#facc15'],
                centerColor: '#713f12',
                maxScale: 1.5
            },
            tulip: {
                name: '鬱金香',
                petals: 6,
                petalColors: ['#fb7185', '#e11d48', '#a855f7'],
                centerColor: '#fef08a',
                maxScale: 1.3
            },
            lotus: {
                name: '蓮花',
                petals: 12,
                petalColors: ['#38bdf8', '#818cf8', '#c084fc'],
                centerColor: '#fef08a',
                maxScale: 1.4
            },
            daisy: {
                name: '雛菊',
                petals: 12,
                petalColors: ['#ffffff', '#f1f5f9', '#e2e8f0'],
                centerColor: '#f59e0b',
                maxScale: 1.1
            }
        };

        // Collections
        let flowers = [];
        let particles = [];
        let ambientPollens = [];

        // Audio Engine Synthesizer (Harp/Chimes)
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playFlowerChime(freq = 523) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.5, now + 0.35);

                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.35);
            } catch(e) {}
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundStatusText');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-base';
                text.innerText = '琴音：開啟';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-base text-slate-500';
                text.innerText = '琴音：關閉';
            }
        }

        class Flower {
            constructor(x, y, speciesKey = null) {
                this.x = x;
                this.y = y; // Ground Root Y
                this.targetHeight = 120 + Math.random() * 180;
                this.height = 0; // Growth animation height
                
                // Select Species
                const keys = Object.keys(SPECIES_TYPES);
                this.speciesKey = speciesKey || (config.selectedSpecies === 'random' ? keys[Math.floor(Math.random() * keys.length)] : config.selectedSpecies);
                this.species = SPECIES_TYPES[this.speciesKey] || SPECIES_TYPES.sakura;

                // Physics stem sway parameters
                this.angle = 0;
                this.angularVelocity = 0;
                this.stiffness = 0.05;
                this.damping = 0.88;

                // Bloom Dynamics
                this.bloomPhase = 0; // 0 (Bud) to 1 (Full Bloom)
                this.targetBloom = 0.2;
                this.petalColor = this.species.petalColors[Math.floor(Math.random() * this.species.petalColors.length)];
                this.centerColor = this.species.centerColor;
                this.radius = 20 + Math.random() * 18;
                this.chimePitch = 300 + Math.random() * 600;

                // Leaves along stem
                this.leaves = [
                    { percent: 0.3, side: -1, size: 14 + Math.random() * 8 },
                    { percent: 0.6, side: 1, size: 16 + Math.random() * 10 }
                ];
            }

            update() {
                // Grow Stem Height smoothly
                if (this.height < this.targetHeight) {
                    this.height += (this.targetHeight - this.height) * 0.05;
                }

                // Calculate distance to cursor
                const tipX = this.x + Math.sin(this.angle) * this.height;
                const tipY = this.y - Math.cos(this.angle) * this.height;

                const dx = mouse.x - tipX;
                const dy = mouse.y - tipY;
                const dist = Math.hypot(dx, dy);

                // Wind sway force
                const windForce = Math.sin(Date.now() * 0.002 + this.x) * (config.windLevel * 0.008);

                // Proximity cursor push & bloom reaction
                if (dist < 220) {
                    const force = (1 - dist / 220) * 0.02 * config.sensitivity;
                    const pushDirection = dx > 0 ? -1 : 1;
                    this.angularVelocity += pushDirection * force;

                    // Expand bloom open near cursor
                    this.targetBloom = 1.0;

                    if (Math.random() < 0.02) {
                        playFlowerChime(this.chimePitch);
                    }
                } else {
                    this.targetBloom = 0.25;
                }

                // Spring physics spring back
                const springForce = -this.angle * this.stiffness;
                this.angularVelocity += springForce + windForce;
                this.angularVelocity *= this.damping;
                this.angle += this.angularVelocity;

                // Smooth Bloom Transition
                this.bloomPhase += (this.targetBloom - this.bloomPhase) * 0.08;
            }

            draw() {
                ctx.save();

                // 1. Draw Curved Stem
                const theme = GARDEN_THEMES[config.theme];
                const tipX = this.x + Math.sin(this.angle) * this.height;
                const tipY = this.y - Math.cos(this.angle) * this.height;
                const ctrlX = this.x + Math.sin(this.angle * 0.5) * (this.height * 0.5);
                const ctrlY = this.y - (this.height * 0.5);

                ctx.strokeStyle = theme.stemBase;
                ctx.lineWidth = Math.max(3, 6 * (this.height / this.targetHeight));
                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
                ctx.stroke();

                // 2. Draw Leaves
                this.leaves.forEach(leaf => {
                    const lx = this.x + Math.sin(this.angle) * (this.height * leaf.percent);
                    const ly = this.y - Math.cos(this.angle) * (this.height * leaf.percent);

                    ctx.save();
                    ctx.translate(lx, ly);
                    ctx.rotate(this.angle + leaf.side * 0.8);
                    ctx.fillStyle = theme.stemBase;
                    ctx.beginPath();
                    ctx.ellipse(leaf.side * leaf.size * 0.5, 0, leaf.size, leaf.size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // 3. Draw Blooming Flower Head at Tip
                ctx.translate(tipX, tipY);
                ctx.rotate(this.angle * 0.3);

                const currentRadius = this.radius * (0.4 + this.bloomPhase * 0.6);
                const petalCount = this.species.petals;

                // Render Petals
                ctx.fillStyle = this.petalColor;
                ctx.shadowBlur = 12 * this.bloomPhase;
                ctx.shadowColor = this.petalColor;

                for (let i = 0; i < petalCount; i++) {
                    const petalAngle = (i * Math.PI * 2) / petalCount;
                    ctx.save();
                    ctx.rotate(petalAngle);

                    ctx.beginPath();
                    if (this.speciesKey === 'tulip') {
                        ctx.ellipse(0, -currentRadius * 0.8, currentRadius * 0.4, currentRadius * 0.9, 0, 0, Math.PI * 2);
                    } else if (this.speciesKey === 'sunflower') {
                        ctx.ellipse(0, -currentRadius * 1.1, currentRadius * 0.25, currentRadius * 0.8, 0, 0, Math.PI * 2);
                    } else { // Daisy, Sakura, Lotus
                        ctx.ellipse(0, -currentRadius, currentRadius * 0.35, currentRadius * 0.7, 0, 0, Math.PI * 2);
                    }
                    ctx.fill();
                    ctx.restore();
                }

                // Render Flower Core / Stamen
                ctx.fillStyle = this.centerColor;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.centerColor;
                ctx.beginPath();
                ctx.arc(0, 0, currentRadius * 0.35, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color, type = 'pollen') {
                this.x = x;
                this.y = y;
                this.type = type;
                this.vx = (Math.random() - 0.5) * (type === 'sparkle' ? 5 : 2);
                this.vy = (Math.random() - 0.5) * (type === 'sparkle' ? 5 : 2) - 0.5;
                this.size = type === 'sparkle' ? 3 + Math.random() * 4 : 2 + Math.random() * 3;
                this.color = color;
                this.alpha = 1.0;
                this.life = 0.01 + Math.random() * 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.life;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Floating Ambient Pollen Particles
        class AmbientPollen {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = -0.2 - Math.random() * 0.4;
                this.radius = 1.5 + Math.random() * 2.5;
                this.alpha = 0.2 + Math.random() * 0.6;
            }

            update() {
                this.x += this.vx + Math.sin(Date.now() * 0.001 + this.y) * 0.2;
                this.y += this.vy;
                if (this.y < 0 || this.x < 0 || this.x > width) {
                    this.reset();
                    this.y = height;
                }
            }

            draw() {
                const theme = GARDEN_THEMES[config.theme];
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = theme.pollenColor;
                ctx.shadowBlur = 6;
                ctx.shadowColor = theme.pollenColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initGarden() {
            flowers = [];
            particles = [];
            ambientPollens = [];

            const flowerSpacing = Math.max(50, width / 18);
            const groundY = height * 0.92;

            // Generate initial flower bed across base
            for (let x = 30; x < width - 30; x += flowerSpacing + (Math.random() * 20 - 10)) {
                flowers.push(new Flower(x, groundY));
            }

            // Create Ambient Floating Pollen
            for (let i = 0; i < config.pollenDensity; i++) {
                ambientPollens.push(new AmbientPollen());
            }

            updateStatsDisplay();
        }

        function updateStatsDisplay() {
            document.getElementById('flowerCountText').innerText = `${flowers.length} 朵盛開`;
        }

        function animate() {
            // 1. Draw Background Theme Gradient
            const theme = GARDEN_THEMES[config.theme];
            const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
            bgGrad.addColorStop(0, theme.bgGradient[0]);
            bgGrad.addColorStop(0.6, theme.bgGradient[1]);
            bgGrad.addColorStop(1, theme.bgGradient[2]);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Ground Meadow Bed
            ctx.fillStyle = theme.groundColor;
            ctx.shadowBlur = 20;
            ctx.shadowColor = theme.groundColor;
            ctx.beginPath();
            ctx.ellipse(width / 2, height + 40, width * 0.6, 120, 0, 0, Math.PI * 2);
            ctx.fill();

            // 3. Update & Render Flowers
            flowers.forEach(flower => {
                flower.update();
                flower.draw();
            });

            // 4. Update & Render Ambient Pollen
            ambientPollens.forEach(pollen => {
                pollen.update();
                pollen.draw();
            });

            // 5. Update & Render Mouse Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // 6. Handle Interactive Cursor Particle Trail
            const dx = mouse.x - mouse.lastX;
            const dy = mouse.y - mouse.lastY;
            const speed = Math.hypot(dx, dy);

            if (speed > 1.5 || mouse.mode === 'magic') {
                if (Math.random() < 0.8) {
                    particles.push(new Particle(mouse.x, mouse.y, theme.pollenColor, mouse.mode === 'magic' ? 'sparkle' : 'pollen'));
                }
            }

            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;

            requestAnimationFrame(animate);
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            customCursor.style.left = `${mouse.x}px`;
            customCursor.style.top = `${mouse.y}px`;
        });

        window.addEventListener('mousedown', (e) => {
            initAudio();
            mouse.isDown = true;

            // Mode Plant: Seed a new flower at click location base
            if (mouse.mode === 'plant') {
                const groundY = height * 0.92;
                flowers.push(new Flower(mouse.x, groundY));
                playFlowerChime(600);
                updateStatsDisplay();

                // Sparkle burst
                const theme = GARDEN_THEMES[config.theme];
                for (let i = 0; i < 15; i++) {
                    particles.push(new Particle(mouse.x, mouse.y, theme.pollenColor, 'sparkle'));
                }
            } else if (mouse.mode === 'magic') {
                const theme = GARDEN_THEMES[config.theme];
                for (let i = 0; i < 25; i++) {
                    particles.push(new Particle(mouse.x, mouse.y, theme.pollenColor, 'sparkle'));
                }
                playFlowerChime(750);
            }
        });

        window.addEventListener('mouseup', () => {
            mouse.isDown = false;
        });

        // Mobile Touch Support
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
                mouse.isDown = true;

                if (mouse.mode === 'plant') {
                    const groundY = height * 0.92;
                    flowers.push(new Flower(mouse.x, groundY));
                    updateStatsDisplay();
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            mouse.isDown = false;
        });

        // Resize Canvas Adaptability
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initGarden();
        });

        function setInteractionMode(mode) {
            mouse.mode = mode;
            document.querySelectorAll('#modeBloom, #modePlant, #modeMagic').forEach(btn => btn.classList.remove('active'));

            if (mode === 'bloom') document.getElementById('modeBloom').classList.add('active');
            if (mode === 'plant') document.getElementById('modePlant').classList.add('active');
            if (mode === 'magic') document.getElementById('modeMagic').classList.add('active');
        }

        function toggleSettingsDrawer() {
            const drawer = document.getElementById('settingsDrawer');
            drawer.classList.toggle('translate-x-full');
        }

        function setTheme(themeKey) {
            if (GARDEN_THEMES[themeKey]) {
                config.theme = themeKey;
            }
        }

        function updateWindIntensity(val) {
            config.windLevel = parseInt(val);
            const labels = ['靜止', '微風', '和風', '強風'];
            document.getElementById('windVal').innerText = labels[val];
        }

        function updatePollenDensity(val) {
            config.pollenDensity = parseInt(val);
            const labels = ['低', '中等', '高', '濃郁'];
            const idx = Math.min(3, Math.floor(val / 20));
            document.getElementById('pollenVal').innerText = labels[idx];

            // Adjust particle count
            ambientPollens = Array.from({ length: config.pollenDensity }, () => new AmbientPollen());
        }

        function updateSensitivity(val) {
            config.sensitivity = parseInt(val);
            const labels = ['柔和', '敏銳', '極速'];
            document.getElementById('reactVal').innerText = labels[val - 1];
        }

        function triggerSuperBloom() {
            playFlowerChime(800);
            flowers.forEach(flower => {
                flower.targetBloom = 1.0;
                flower.angularVelocity = (Math.random() - 0.5) * 0.15;
            });

            const theme = GARDEN_THEMES[config.theme];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle(Math.random() * width, Math.random() * height * 0.8, theme.pollenColor, 'sparkle'));
            }
        }

        function addDenseFlowerCluster() {
            const groundY = height * 0.92;
            for (let i = 0; i < 8; i++) {
                flowers.push(new Flower(Math.random() * (width - 100) + 50, groundY));
            }
            updateStatsDisplay();
            playFlowerChime(650);
        }

        function resetGarden() {
            initGarden();
            playFlowerChime(400);
        }

        // Window Bootstrapper
        window.onload = () => {
            initGarden();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
